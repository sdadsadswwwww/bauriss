name: Schaubild veröffentlichen

# Playbook vom 14.11.2026: Reel um 12:45 Uhr, Carousel um 18:30 Uhr, Story fünf Minuten danach
# (deutsche Zeit, Uhrzeiten stehen in plan.json). tools/zeitplan.py arbeitet ab, was fällig ist, und postet nie doppelt.
on:
  schedule:
    # Angaben in UTC. GitHub startet Läufe oft 40 bis 55 Minuten zu spät. Deshalb startet jeder Lauf eine Stunde
    # vor der Uhrzeit und wartet im Job "warten" bis dahin. Je zwei Zeilen: die erste greift im Sommer, die zweite im Winter.
    - cron: '45 9 * * *'
    - cron: '45 10 * * *'
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
    # Reserve am Abend, falls ein Lauf scheitert oder ein Post erst spät fertig wird
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      probelauf:
        description: Nur prüfen, nichts veröffentlichen
        type: boolean
        default: true
      zeitplan:
        description: Den ganzen Zeitplan abarbeiten wie ein Lauf aus dem Zeitplan (Reel, Carousel, Story)
        type: boolean
        default: false
      zugang:
        description: Nur das Zugriffstoken prüfen
        type: boolean
        default: false
      reel:
        description: Reel statt Carousel
        type: boolean
        default: false
      reel_test:
        description: Reel von Instagram verarbeiten lassen, ohne zu veröffentlichen
        type: boolean
        default: false
      story_test:
        description: Story-Behälter anlegen, ohne zu veröffentlichen
        type: boolean
        default: false
      post:
        description: Dieser Post statt des heute fälligen (z. B. 001-geburten)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  warten:
    # Ohne gemeinsame Gruppe, damit ein wartender Lauf keinen anderen aufhält
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schaubild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bis zur Uhrzeit warten
        run: python tools/zeitplan.py --warten

  post:
    needs: warten
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: post
      cancel-in-progress: false
    defaults:
      run:
        working-directory: schaubild
    steps:
      - uses: actions/checkout@v4
        with:
          # Der neueste Stand, nicht der vom Start des Laufs: Während des Wartens kann ein anderer Lauf veröffentlicht haben.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_SCHAUBILD }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/schaubild
          EREIGNIS: ${{ github.event_name }}
          ZEITPLAN: ${{ inputs.zeitplan }}
          PROBELAUF: ${{ inputs.probelauf }}
          SCHALTER: ${{ inputs.zugang && '--zugang' || inputs.story_test && '--story-test' || inputs.reel_test && '--reel-test' || inputs.reel && (inputs.probelauf && '--reel --probelauf' || '--reel') || inputs.probelauf && '--probelauf' || '' }}
          POST: ${{ inputs.post }}
        run: |
          if [ "$EREIGNIS" = "schedule" ]; then
            python tools/zeitplan.py
          elif [ "$ZEITPLAN" = "true" ]; then
            if [ "$PROBELAUF" = "true" ]; then python tools/zeitplan.py --probelauf; else python tools/zeitplan.py; fi
          else
            python tools/publish.py $SCHALTER ${POST:+--post "$POST"}
          fi
      - name: Protokoll sichern
        if: always()
        run: |
          git config user.name "schaubild-bot"
          git config user.email "schaubild-bot@users.noreply.github.com"
          git add veroeffentlicht.json
          git diff --cached --quiet && exit 0
          git commit -m "Schaubild veröffentlicht am $(date -u +%F)"
          # Vor dem Übertragen den Stand des Servers holen: Automatik und andere Workflows können zwischendurch übertragen haben.
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
