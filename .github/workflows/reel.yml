name: Reel rendern

# Baut zu jedem geplanten Post das Reel mit Musik und legt es in die Ablage auf GitHub (Release "medien").
# Die Videos stehen bewusst nicht im Repository: Es würde sonst jedes Jahr um mehr als ein Gigabyte wachsen.
# Das Video entsteht hier, weil dafür ffmpeg nötig ist; veröffentlicht wird es vom Workflow "Post veröffentlichen".
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'plan.json'
      - 'tools/reel.py'
      - 'tools/musik.py'
  workflow_dispatch:
    inputs:
      post:
        description: Nur dieser Post, auch wenn das Video schon da ist (z. B. 005-koelner-dom)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: bauriss-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Rendern
        env:
          POST: ${{ inputs.post }}
        run: python tools/reel.py ${POST:---fehlende}
      - name: Ablegen
        run: |
          ls reels/*.mp4 >/dev/null 2>&1 || { echo "Nichts abzulegen."; exit 0; }
          gh release view medien >/dev/null 2>&1 || gh release create medien --latest=false \
            --title "Medien" --notes "Videos zu den geplanten Posts. Dieser Eintrag wird vom Workflow „Reel rendern“ gepflegt; bitte nicht löschen."
          gh release upload medien reels/*.mp4 --clobber
      - name: Alte Videos entfernen
        run: |
          # Videos, deren Reel seit mehr als drei Tagen erschienen ist, braucht Instagram nicht mehr.
          python - <<'EOF' > alt.txt
          import datetime as dt, json
          grenze = (dt.date.today() - dt.timedelta(days=3)).isoformat()
          for e in json.load(open('veroeffentlicht.json', encoding='utf-8')):
              if e.get('art') == 'reel' and e['datum'] < grenze:
                  print(e['post'] + '.mp4')
          EOF
          vorhanden=$(gh release view medien --json assets --jq '.assets[].name' 2>/dev/null || true)
          while read -r name; do
            if echo "$vorhanden" | grep -qx "$name"; then gh release delete-asset medien "$name" -y; fi
          done < alt.txt
