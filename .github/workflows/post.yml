name: Post veröffentlichen

on:
  schedule:
    # Täglich (Mo–So) drei Läufe, angegeben in UTC. GitHub startet sie erfahrungsgemäß 40 bis 55 Minuten später,
    # im Winter also gegen 18:25, 19:10 und 22:15 Uhr deutscher Zeit. Der dritte ist Reserve, falls die
    # ersten beiden scheitern oder der Post des Tages erst am Abend fertig wird.
    # tools/publish.py wartet selbst auf die Uhrzeit aus plan.json und postet nie doppelt.
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      probelauf:
        description: Nur prüfen, nichts veröffentlichen
        type: boolean
        default: true
      zugang:
        description: Nur das Zugriffstoken prüfen
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python tools/publish.py ${{ github.event_name == 'workflow_dispatch' && (inputs.zugang && '--zugang' || inputs.probelauf && '--probelauf') || '' }}
      - name: Protokoll sichern
        run: |
          git config user.name "bauriss-bot"
          git config user.email "bauriss-bot@users.noreply.github.com"
          git add veroeffentlicht.json
          # Vor dem Übertragen den Stand des Servers holen: Die Automatik kann zwischendurch einen neuen Post eingestellt haben.
          git diff --cached --quiet || (git commit -m "Veröffentlicht am $(date -u +%F)" && git pull --rebase && git push)
