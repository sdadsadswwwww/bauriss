name: Post veröffentlichen

on:
  schedule:
    # 18:30 Uhr deutscher Zeit, angegeben in UTC: im Sommer greift der erste Lauf, im Winter der zweite.
    # tools/publish.py wartet selbst auf die Uhrzeit aus plan.json und postet nie doppelt.
    - cron: '30 16 * * 1-5'
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
    inputs:
      probelauf:
        description: Nur prüfen, nichts veröffentlichen
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python tools/publish.py ${{ github.event_name == 'workflow_dispatch' && inputs.probelauf && '--probelauf' || '' }}
      - name: Protokoll sichern
        run: |
          git config user.name "bauriss-bot"
          git config user.email "bauriss-bot@users.noreply.github.com"
          git add veroeffentlicht.json
          git diff --cached --quiet || (git commit -m "Veröffentlicht am $(date -u +%F)" && git push)
