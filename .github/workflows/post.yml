name: Post veröffentlichen

on:
  schedule:
    # Täglich zwei Läufe, angegeben in UTC. GitHub startet sie erfahrungsgemäß 40 bis 55 Minuten später,
    # im Winter also gegen 18:25 und 19:10 Uhr deutscher Zeit.
    # tools/publish.py wartet selbst auf die Uhrzeit aus plan.json und postet nie doppelt.
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    # 12:30 Uhr deutscher Zeit: das Reel mit Musik zum Post des Tages (tools/publish.py --reel)
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      probelauf:
        description: Nur prüfen, nichts veröffentlichen
        type: boolean
        default: true
      zugang:
        description: Nur das Zugriffstoken prüfen
        type: boolean
        default: false
      reel:
        description: Reel statt Carousel
        type: boolean
        default: false
      reel_test:
        description: Reel von Instagram verarbeiten lassen, ohne zu veröffentlichen
        type: boolean
        default: false
      post:
        description: Dieser Post statt des heute fälligen (z. B. 002-kaiserwahl-1519)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          POST: ${{ inputs.post }}
        run: python tools/publish.py ${{ github.event_name == 'workflow_dispatch' && (inputs.zugang && '--zugang' || inputs.reel_test && '--reel-test' || inputs.reel && (inputs.probelauf && '--reel --probelauf' || '--reel') || inputs.probelauf && '--probelauf') || (contains(github.event.schedule, ' 10 ') || contains(github.event.schedule, ' 11 ')) && '--reel' || '' }} ${POST:+--post "$POST"}
      - name: Protokoll sichern
        run: |
          git config user.name "kassenbuch-bot"
          git config user.email "kassenbuch-bot@users.noreply.github.com"
          git add veroeffentlicht.json
          git diff --cached --quiet || (git commit -m "Veröffentlicht am $(date -u +%F)" && git pull --rebase && git push)
