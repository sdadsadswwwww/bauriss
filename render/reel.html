<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kassenbuch Reel</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Reel: 1080 x 1920. Oben 240 px und unten 340 px bleiben frei, dort liegt die Bedienung von Instagram. */
  #sheet { height: 1920px; }
  .reel { position: absolute; left: 118px; right: 64px; top: 250px; bottom: 340px; display: flex; flex-direction: column; }
  .reel > * { position: relative; flex: none; }
  .reel > .rosette { position: absolute; width: 1000px; height: 1000px; right: -470px; top: -330px; opacity: 0.45; }
  .reel .frage { font-family: var(--f-kopf); font-weight: 900; font-size: 76px; line-height: 1.06; min-height: 162px; }
  .reel .frage i { font-weight: 700; font-style: italic; color: var(--acc); }
  .reel .zahl { font-family: var(--f-kopf); font-weight: 900; font-size: 372px; line-height: 0.86; margin: 34px 0 0 -14px; letter-spacing: -0.03em; white-space: nowrap; transform-origin: left bottom; }
  .reel .einheit { font-family: var(--f-kopf); font-weight: 700; font-style: italic; font-size: 104px; line-height: 1; color: var(--acc); margin-top: 6px; }
  .reel h1 { font-size: 78px; line-height: 1.05; margin-top: 10px; min-height: 164px; }
  .reel .buch { margin-top: 30px; }
  .reel > .stempel { position: absolute; right: -6px; top: 630px; width: 300px; height: 300px; }
  .reel .hinweis { margin-top: 30px; font-family: var(--f-mono); font-weight: 500; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--acc); }
  .reel .marke-zeile { margin-top: auto; border-top: 3px double var(--ink); padding-top: 22px; display: flex; align-items: center; gap: 16px;
    font-family: var(--f-mono); font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--leise); white-space: nowrap; }
  .reel .marke-zeile .marke { width: 54px; height: 54px; flex: none; }
  .reel .marke-zeile .name { font-family: var(--f-kopf); font-size: 46px; font-weight: 900; text-transform: none; letter-spacing: 0.02em; color: var(--ink); margin-right: 14px; }
</style>
</head>
<body>
<div id="sheet"></div>
<script src="render.js"></script>
<script>
  // Aufruf über tools/reel.py: reel.html?post=<name>&konto=<handle>
  // Die Seite läuft nicht von selbst ab. tools/reel.py ruft für jedes Bild window.zeige(sekunde) auf.
  // Die Zeiten gelten auch für die Musik (tools/musik.py, Konstante ZEIT): bei "zahl" fällt der Stempel.
  const q = new URLSearchParams(location.search);
  const schriften = ['700 10px "Playfair Display"', '900 10px "Playfair Display"', 'italic 700 10px "Playfair Display"', '400 10px Barlow', '600 10px Barlow',
    '400 10px "IBM Plex Mono"', '500 10px "IBM Plex Mono"'];
  const ZEIT = { start: 1.0, ende: 7.0, zahl: 7.2, satz: 8.0, dauer: 11.0 };
  const grenze = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const weich = x => x * x * (3 - 2 * x);

  // Zahl des Titelblatts zum Hochzählen zerlegen. Geht das nicht (z. B. "1 : 1"), wird sie nur eingeblendet.
  function zaehler(text) {
    if (!/^\d[\d.]*(,\d+)?$/.test(text)) return null;
    const stellen = text.includes(',') ? text.split(',')[1].length : 0;
    const ziel = parseFloat(text.replace(/\./g, '').replace(',', '.'));
    const punkte = text.includes('.');
    return p => p >= 1 ? text : (ziel * p).toLocaleString('de-DE', { minimumFractionDigits: stellen, maximumFractionDigits: stellen, useGrouping: punkte });
  }

  function baue(post) {
    const titel = post.slides[0];
    const frage = (post.reel && post.reel.frage) || post.titel;
    const zeilen = titel.zeilen || [];
    document.getElementById('sheet').innerHTML =
      `<div class="folio">Folio ${post.nr} · Reel</div>` +
      `<div class="reel">${rosette()}<div class="kicker">${titel.kicker}</div><div class="frage">${frage}</div>` +
      `<div class="zahl">${titel.zahl}</div><div class="einheit">${titel.einheit}</div><h1>${titel.headline}</h1>` +
      (zeilen.length ? journal(zeilen, titel.spalten) : '') +
      `<div class="hinweis">Die ganze Buchung: heute im Profil</div>` +
      (titel.stempel ? stempel(titel.stempel) : '') +
      `<div class="marke-zeile">${marke()}<span class="name">Kassenbuch</span><span>${post.konto} · täglich 18:15 Uhr</span></div></div>` +
      `${korn()}<div class="rahmen"></div>`;

    const el = s => document.querySelector('.reel ' + s);
    const zahl = el('.zahl'), einheit = el('.einheit'), kopf = el('h1'), hinweis = el('.hinweis'), stmp = el('.stempel'), ros = el('.rosette');
    const reihen = [...document.querySelectorAll('.reel .buch .zeile')];
    const buch = el('.buch');
    // Zu breite Zahlen verkleinern, damit sie nicht aus dem Blatt laufen
    const platz = 1080 - 118 - 64;
    if (zahl.scrollWidth > platz) zahl.style.fontSize = Math.floor(372 * platz / zahl.scrollWidth) + 'px';
    const zaehle = zaehler(titel.zahl);

    window.zeige = t => {
      const p = weich(grenze((t - ZEIT.start) / (ZEIT.ende - ZEIT.start)));
      ros.style.transform = `rotate(${(t * 2.4).toFixed(3)}deg)`;
      if (zaehle) { zahl.textContent = zaehle(p); zahl.style.opacity = grenze((t - ZEIT.start + 0.3) / 0.4); }
      else zahl.style.opacity = grenze((t - ZEIT.start) / 1.2);
      einheit.style.opacity = grenze((t - ZEIT.start - 0.3) / 0.6);
      // Journalzeilen schreiben sich nacheinander ein, gleichmäßig über die Zeit des Hochzählens verteilt
      if (buch) buch.style.opacity = grenze((t - ZEIT.start - 1.2) / 0.5);
      reihen.forEach((r, i) => {
        const ab = ZEIT.start + 2.0 + i * (ZEIT.ende - ZEIT.start - 2.6) / Math.max(1, reihen.length);
        const a = grenze((t - ab) / 0.5);
        r.style.clipPath = `inset(0 ${(100 * (1 - weich(a))).toFixed(2)}% 0 0)`;
      });
      // Der Stempel fällt, wenn die Zahl steht: groß und blass, dann klein und kräftig
      const z = grenze((t - ZEIT.zahl) / 0.22);
      if (stmp) {
        stmp.style.opacity = z ? 0.86 * z : 0;
        stmp.style.transform = `rotate(-13deg) scale(${(1.7 - 0.7 * weich(z)).toFixed(4)})`;
      }
      zahl.style.transform = `scale(${(1 + 0.03 * Math.sin(Math.PI * grenze((t - ZEIT.zahl) / 0.4))).toFixed(4)})`;
      kopf.style.opacity = grenze((t - ZEIT.zahl - 0.15) / 0.5);
      hinweis.style.opacity = grenze((t - ZEIT.satz) / 0.6);
    };
    window.zeige(0);
    window.dauer = ZEIT.dauer;
    window.bereit = true;
  }

  fetch('../posts/' + q.get('post') + '.json')
    .then(r => r.json())
    .then(post => Promise.all([post, ...schriften.map(s => document.fonts.load(s))]))
    .then(([post]) => {
      baue({ ...post, konto: '@' + q.get('konto') });
      if (q.has('t')) window.zeige(+q.get('t'));
    });
</script>
</body>
</html>
